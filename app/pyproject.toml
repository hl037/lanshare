[project]
name = "lanshare"
version = "0.1.0"
description = "Fast LAN file exchange with optional TLS 1.3 encryption (Qt UI + Rust daemon)"
requires-python = ">=3.9"
dependencies = ["PySide6-Essentials>=6.7"]

[project.scripts]
lanshare = "lanshare.__main__:main"

[project.gui-scripts]
lanshare-gui = "lanshare.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lanshare*"]

[tool.setuptools.package-data]
lanshare = ["bin/*"]
