[package]
name = "lanshared"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8"] }
hex = "0.4.3"
hostname = "0.4.2"
if-addrs = "0.15.0"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util"] }
walkdir = "2.5.0"
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
